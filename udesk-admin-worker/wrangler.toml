name = "udesk-admin-otp"
main = "worker.js"
compatibility_date = "2024-11-01"

[vars]
FIREBASE_PROJECT = "utc-next"
# A from-address on a domain onboarded to Cloudflare Email Sending (unext.studio is onboarded).
SENDER_EMAIL = "UDesk <udesk@unext.studio>"
# ADMIN_UID is set as a secret (wrangler secret put ADMIN_UID) so it is not in the public repo.

# Cloudflare Email Sending binding (no third-party provider).
[[send_email]]
name = "EMAIL"

# Create the KV namespace (`npx wrangler kv namespace create OTP_KV`) and paste its id here.
[[kv_namespaces]]
binding = "OTP_KV"
id = "PUT_KV_NAMESPACE_ID_HERE"

# UDesk website (static files) for Synology Container Manager.
# Serves /volume1/docker/udesk/www on host port 8480; the DSM reverse proxy maps
# https://desk.unext.studio to it. Kept apart from the hbbs/hbbr project so that
# updating the site never restarts the server.
services:
  web:
    container_name: udesk-web
    image: nginx:alpine
    volumes:
      - /volume1/docker/udesk/www:/usr/share/nginx/html:ro
    ports:
      - "8480:80"
    restart: unless-stopped
